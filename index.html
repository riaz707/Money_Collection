<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Management</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .section {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .add-btn {
            background: green;
        }

        .admin-btn {
            background: black;
        }

        .edit-btn {
            background: orange;
            padding: 7px 12px;
        }

        .delete-btn {
            background: red;
            padding: 7px 12px;
            margin-left: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .total {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .view-text {
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>টাকা ম্যানেজমেন্ট সিস্টেম</h2>

        <!-- FORM -->
        <div id="formBox" style="display:none;">

            <input type="text" id="name" placeholder="নাম">

            <input type="number" id="amount" placeholder="টাকার পরিমাণ">

            <input type="date" id="date">

            <select id="type">
                <option value="income">টাকা উঠানো</option>
                <option value="expense">টাকা খরচ</option>
            </select>

            <div class="button-row">

                <button class="add-btn" onclick="addData()">
                    যোগ করুন
                </button>

                <button class="admin-btn" id="adminBtn">
                    Admin
                </button>

            </div>

        </div>

        <!-- VIEW MODE -->
        <div id="viewMode">

            <div class="button-row">

                <button class="admin-btn" id="adminBtn2">
                    Admin Login
                </button>

            </div>

        </div>

        <!-- INCOME -->
        <div class="section">

            <h3>টাকা উত্তোলন</h3>

            <table>

                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>টাকা</th>
                        <th>তারিখ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>

                <tbody id="incomeList"></tbody>

            </table>

            <div class="total">
                মোট উত্তোলন: ৳ <span id="incomeTotal">0</span>
            </div>

        </div>

        <!-- EXPENSE -->
        <div class="section">

            <h3>টাকা খরচ</h3>

            <table>

                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>টাকা</th>
                        <th>তারিখ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>

                <tbody id="expenseList"></tbody>

            </table>

            <div class="total">
                মোট খরচ: ৳ <span id="expenseTotal">0</span>
            </div>

        </div>

        <!-- BALANCE -->
        <div class="section">

            <h3>খরচের পর অবশিষ্ট টাকা</h3>

            <div class="total">
                বর্তমান ব্যালেন্স: ৳ <span id="balance">0</span>
            </div>

        </div>

        <!-- FOOTER -->
        <div class="footer">

            <div style="font-size:18px;font-weight:bold;">
                পেমেন্ট করুন
            </div>

            <div style="font-size:22px;font-weight:bold;">
                📱 01893454283
            </div>

            <div style="color:green;font-weight:bold;">
                বিকাশ / নগদ / রকেট
            </div>

            <div style="color:gray;">
                (পার্সোনাল নাম্বার)
            </div>

            <div style="margin-top:10px;color:#999;font-size:14px;">
                টাকা পাঠানোর পর Admin কে জানিয়ে দিন ।
            </div>

        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
