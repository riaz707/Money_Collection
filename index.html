<!DOCTYPE html>
<title>টাকা তোলার লিস্ট</title>

<style>
    body {
        font-family: sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }

    .box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 800px;
        margin: auto;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
    }

    button {
        padding: 8px 15px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        color: white;
        border-radius: 5px;
    }

    .add-btn {
        background: green;
    }

    .edit-btn {
        background: orange;
    }

    .delete-btn {
        background: red;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    table th,
    table td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
    }

    h2 {
        text-align: center;
    }

    .total {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        color: green;
    }
</style>
</head>

<body>

    <div class="box">

        <h2>ইয়ানত এর টাকা</h2>

        <input type="text" id="name" placeholder="নাম">
        <input type="number" id="amount" placeholder="টাকার পরিমাণ">
        <input type="date" id="date">

        <button class="add-btn" onclick="addData()">যোগ করুন</button>

        <table>
            <thead>
                <tr>
                    <th>নাম</th>
                    <th>টাকা</th>
                    <th>তারিখ</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>

            <tbody id="list"></tbody>
        </table>

        <div class="total">
            মোট টাকা: ৳ <span id="total">0</span>
        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
